spring.application.name=restful-web-services

#spring.mvc.apiversion.use.path-segment=0
#spring.mvc.apiversion.use.query-parameter=version
#spring.mvc.apiversion.use.header=X-API-VERSION
#spring.mvc.apiversion.use.media-type-parameter[application/json]=version

#Expose all the APIs
#management.endpoints.web.exposure.include=*
spring.h2.console.enabled=true

#spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true


spring.datasource.url=jdbc:mysql://localhost:3306/social-media-database
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.security.user.name=${SECURITY_USER}
spring.security.user.password==${SECURITY_PASSWORD}